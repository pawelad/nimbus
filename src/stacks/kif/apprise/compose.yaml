---
name: apprise

services:
  apprise:
    image: caronc/apprise:v1.3.1
    container_name: apprise
    volumes:
      - /data/apps/apprise/config:/config
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: 1
      APPRISE_ADMIN: "y"
    ports:
      - "0.0.0.0:8008:8000"
    networks:
      - caddy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:8000/status" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      caddy_0: apprise.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.reverse_proxy: "{{upstreams 8000}}"
      caddy_1: apprise.home apprise.pipusznicy
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 8000}}"
      # LoggiFly
      loggifly.monitor: "true"
networks:
  caddy:
    external: true
