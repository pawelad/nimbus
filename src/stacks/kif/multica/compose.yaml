---
name: multica

services:
  multica-backend:
    image: ghcr.io/multica-ai/multica-backend:v0.3.1
    container_name: multica-backend
    depends_on:
      multica-db:
        condition: service_healthy
    volumes:
      - /data/apps/multica/uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://multica:${MULTICA_DB_PASSWORD}@multica-db:5432/multica?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${MULTICA_JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      APP_ENV: production
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      ALLOW_SIGNUP: "${MULTICA_ALLOW_SIGNUP}"
      ALLOWED_EMAILS: "${ALLOWED_EMAILS}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      REALTIME_METRICS_TOKEN: "${REALTIME_METRICS_TOKEN}"
      LOCAL_UPLOAD_DIR: "${LOCAL_UPLOAD_DIR}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
    networks:
      - caddy
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Caddy reverse proxy (WebSocket route)
      caddy_0: multica.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.@ws: path /ws /ws/*
      caddy_0.handle: "@ws"
      caddy_0.handle.reverse_proxy: "{{upstreams 8080}}"
      caddy_0.handle.reverse_proxy.flush_interval: -1
      caddy_1: multica.home multica.pipusznicy
      caddy_1.tls: internal
      caddy_1.@ws: path /ws /ws/*
      caddy_1.handle: "@ws"
      caddy_1.handle.reverse_proxy: "{{upstreams 8080}}"
      caddy_1.handle.reverse_proxy.flush_interval: -1

  multica-db:
    image: pgvector/pgvector:pg17
    container_name: multica-db
    volumes:
      - /data/apps/multica/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: ${MULTICA_DB_PASSWORD}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica"]
      interval: 10s
      timeout: 5s
      retries: 5

  multica-web:
    image: ghcr.io/multica-ai/multica-web:v0.3.1
    container_name: multica-web
    depends_on:
      - multica-backend
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      REMOTE_API_URL: "http://multica-backend:8080"
    networks:
      - caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Caddy reverse proxy
      caddy_0: multica.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: multica.home multica.pipusznicy
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 3000}}"
      # Homepage service discovery
      homepage.group: Apps
      homepage.name: Multica
      homepage.icon: multica.png
      homepage.href: https://multica.pipusznicy.cloud
      homepage.description: Multi-agent AI platform
      homepage.weight: 50

networks:
  caddy:
    external: true
  internal:
    internal: true
