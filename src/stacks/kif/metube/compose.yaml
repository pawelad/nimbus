---
name: metube

services:
  metube:
    image: ghcr.io/alexta69/metube:2026.04.28
    container_name: metube
    volumes:
      - /data/shared/public/metube:/downloads
    ports:
      - "0.0.0.0:8081:8081"
    networks:
      - caddy
    restart: unless-stopped
    healthcheck:
      test: curl --connect-timeout 10 --silent --show-error --fail http://127.0.0.1:8081/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      caddy_0: metube.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.reverse_proxy: "{{upstreams 8081}}"
      caddy_1: metube.home metube.pipusznicy
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 8081}}"
networks:
  caddy:
    external: true
