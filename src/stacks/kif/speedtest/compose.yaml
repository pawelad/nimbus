---
name: speedtest-tracker

services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.13.10
    container_name: speedtest-tracker
    volumes:
      - /data/apps/speedtest-tracker:/config
    environment:
      TZ: Europe/Warsaw
      PUID: 1000
      PGID: 1000
      APP_URL: https://speedtest.pipusznicy.cloud
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "0 * * * *" # Run at minute 0 past every hour
    ports:
      - "0.0.0.0:8070:80"
    networks:
      - caddy
    restart: unless-stopped
    healthcheck:
      test: curl --connect-timeout 15 --silent --show-error --fail http://127.0.0.1:80/api/healthcheck || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # Caddy reverse proxy
      caddy_0: speedtest.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: speedtest.home speedtest.pipusznicy speed.test s.t
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      # Monitoring
      monitor.url: "https://speedtest.pipusznicy.cloud/api/healthcheck"
      # Homepage service discovery
      homepage.group: Monitoring
      homepage.name: Speedtest Tracker
      homepage.icon: speedtest-tracker.png
      homepage.href: https://speedtest.pipusznicy.cloud
      homepage.description: Internet Speed Tracking
      homepage.weight: 40
      homepage.widget.type: speedtest
      homepage.widget.url: http://speedtest-tracker:80

networks:
  caddy:
    external: true
