---
name: glances

services:
  glances:
    ports:
      - "0.0.0.0:61208:61208"
    networks:
      - caddy
    labels:
      caddy_0: glances.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.reverse_proxy: "{{upstreams 61208}}"
      caddy_1: glances.home glances.pipusznicy
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 61208}}"
    extends:
      file: ../../common/glances/base.yaml
      service: glances-base

networks:
  caddy:
    external: true
