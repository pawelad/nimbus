---
name: ollama

services:
  ollama:
    image: ollama/ollama:0.17.4
    container_name: ollama
    volumes:
      - /data/apps/ollama/ollama:/root/.ollama
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ollama --version && ollama ps || exit 1
      start_period: 15s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.4
    container_name: open-webui
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - /data/apps/ollama/open-webui:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    ports:
      - "0.0.0.0:3838:8080"
    networks:
      - caddy
      - internal
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://127.0.0.1:8080 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      caddy_0: llm.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.reverse_proxy: "{{upstreams 8080}}"
      caddy_1: llm.home llm.pipusznicy
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 8080}}"
networks:
  caddy:
    external: true
  internal:
