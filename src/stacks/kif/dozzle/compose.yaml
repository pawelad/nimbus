---
name: dozzle

services:
  dozzle:
    image: amir20/dozzle:v9.0.3
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "0.0.0.0:8888:8080"
    networks:
      - caddy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/dozzle", "healthcheck" ]
    labels:
      caddy_0: dozzle.pipusznicy.cloud
      caddy_0.tls: ${ACME_TLS_CERT} ${ACME_TLS_KEY}
      caddy_0.reverse_proxy: "{{upstreams 8080}}"
      caddy_0.reverse_proxy.flush_interval: "-1"
      caddy_1: dozzle.home dozzle.pipusznicy
      caddy_1.tls: internal
      caddy_1.reverse_proxy: "{{upstreams 8080}}"
      caddy_1.reverse_proxy.flush_interval: "-1"
networks:
  caddy:
    external: true
