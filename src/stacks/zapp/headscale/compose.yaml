---
name: headscale

services:
  headplane:
    image: ghcr.io/tale/headplane:0.6.2
    container_name: headplane
    volumes:
      - /data/apps/headscale/headplane/config.yaml:/etc/headplane/config.yaml:ro
      - /data/apps/headscale/headplane-data:/var/lib/headplane
      - /data/apps/headscale/config:/etc/headscale
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dokploy-network
    restart: unless-stopped
    labels:
      # traefik
      traefik.enable: true
      traefik.http.routers.headplane.rule: Host(`${HEADPLANE_HOSTNAME}`) && PathPrefix(`/admin`)
      traefik.http.routers.headplane.entrypoints: websecure
      traefik.http.routers.headplane.tls.certresolver: letsencrypt
      traefik.http.services.headplane.loadbalancer.server.port: 3000

  headscale:
    image: ghcr.io/juanfont/headscale:0.28.0
    container_name: headscale
    volumes:
      - /data/apps/headscale/config:/etc/headscale
      - /data/apps/headscale/data:/var/lib/headscale
    ports:
      - "0.0.0.0:3478:3478/udp"
    networks:
      - dokploy-network
    command: serve
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "headscale", "health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      me.tale.headplane.target: headscale
      # traefik
      traefik.enable: true
      traefik.http.routers.headscale.rule: Host(`${HEADSCALE_HOSTNAME}`)
      traefik.http.routers.headscale.entrypoints: websecure
      traefik.http.routers.headscale.tls.certresolver: letsencrypt
      traefik.http.services.headscale.loadbalancer.server.port: 8080

      # CORS middleware for Headplane integration
      traefik.http.routers.headscale.middlewares: headscale-cors
      traefik.http.middlewares.headscale-cors.headers.accesscontrolallowheaders: "*"
      traefik.http.middlewares.headscale-cors.headers.accesscontrolallowmethods: GET,POST,PUT
      traefik.http.middlewares.headscale-cors.headers.accesscontrolalloworiginlist: https://${HEADSCALE_HOSTNAME}
      traefik.http.middlewares.headscale-cors.headers.accesscontrolmaxage: 100
      traefik.http.middlewares.headscale-cors.headers.addvaryheader: true

      # Redirect / to /admin
      traefik.http.routers.headscale-redirect.rule: Host(`${HEADSCALE_HOSTNAME}`) && Path(`/`)
      traefik.http.routers.headscale-redirect.service: headscale
      traefik.http.routers.headscale-redirect.middlewares: headscale-redirect
      traefik.http.middlewares.headscale-redirect.redirectregex.regex: "^https?://[^/]+/?$$"
      traefik.http.middlewares.headscale-redirect.redirectregex.replacement: "https://${HEADSCALE_HOSTNAME}/admin"

networks:
  dokploy-network:
    external: true
