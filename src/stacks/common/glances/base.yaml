---
services:
  glances-base:
    image: nicolargo/glances:4.5.0.5
    container_name: glances
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data:/data:ro
    environment:
      GLANCES_OPT: "-w"
    restart: unless-stopped
    healthcheck:
      test: curl --connect-timeout 10 --silent --show-error --fail http://127.0.0.1:61208/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    pid: host
