---
- name: "Ensure Monetr data directories exists"
  ansible.builtin.file:
    path: "{{ apps_data_dir }}/monetr/config"
    state: directory
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0755"

- name: "Ensure Monetr stack is up to date"
  ansible.builtin.import_role:
    name: common
    tasks_from: ensure_stack
  vars:
    stack_name: monetr
    env_template: "kif/monetr/.env.j2"
