---
- name: "Ensure MeTube public directory exists"
  ansible.builtin.file:
    path: "{{ samba_public_share_path }}/metube"
    state: directory
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0775"

- name: "Ensure MeTube stack is up to date"
  ansible.builtin.import_role:
    name: common
    tasks_from: ensure_stack
  vars:
    stack_name: metube
    env_template: "common/acme_cert.env.j2"
