---
- name: "Allow Headscale STUN port through UFW"
  community.general.ufw:
    rule: allow
    port: "3478"
    proto: udp
    comment: "Headscale DERP/STUN"

- name: "Fetch Headscale nodes to find DNS node Tailscale IP"
  ansible.builtin.command: docker exec headscale headscale nodes list -o json
  register: headscale_nodes_output
  changed_when: false
  ignore_errors: true

- name: "Parse DNS node Tailscale IP"
  ansible.builtin.set_fact:
    dns_node_tailscale_ip: >-
      {{
        (
          headscale_nodes_output.stdout | default('[]', true) | from_json
          | community.general.json_query("[?given_name==`" ~ headscale_dns_node ~ "`].ip_addresses[0]")
        ) | default([]) | first | default('')
      }}

- name: "Show DNS node Tailscale IP"
  ansible.builtin.debug:
    var: dns_node_tailscale_ip

- name: "Ensure Headscale configuration"
  ansible.builtin.import_role:
    name: common
    tasks_from: ensure_config
  vars:
    service_name: "headscale"
    config_src: "{{ inventory_hostname }}/headscale.config.yaml.j2"
    config_dest: "{{ apps_data_dir }}/headscale/config/config.yaml"
    mode: "0640"
    owner: "{{ server_user }}"
    group: "{{ server_user }}"

- name: "Ensure Headplane configuration"
  ansible.builtin.import_role:
    name: common
    tasks_from: ensure_config
  vars:
    service_name: "headplane"
    config_src: "{{ inventory_hostname }}/headplane.config.yaml.j2"
    config_dest: "{{ apps_data_dir }}/headscale/headplane/config.yaml"
    mode: "0640"
    owner: "{{ server_user }}"
    group: "{{ server_user }}"

- name: "Ensure Headscale stack is up to date"
  ansible.builtin.import_role:
    name: common
    tasks_from: ensure_stack
  vars:
    stack_name: headscale
    env_template: "{{ inventory_hostname }}/headscale.env.j2"
