---
- name: "Get home external IP from Kif"
  ansible.builtin.uri:
    url: "https://api.ipify.org"
    return_content: true
  delegate_to: "kif"
  register: "_home_ip_kif"
  ignore_errors: true
  run_once: true

- name: "Get home external IP from localhost fallback"
  ansible.builtin.uri:
    url: "https://api.ipify.org"
    return_content: true
  delegate_to: "localhost"
  register: "_home_ip_local"
  when: "_home_ip_kif is failed or _home_ip_kif.content is not defined"
  run_once: true

- name: "Set home external IP fact"
  ansible.builtin.set_fact:
    home_external_ip: >-
      {{ (_home_ip_kif.content | default(None) or
          _home_ip_local.content | default(None) or '') | trim }}

- name: "Ensure CrowdSec stack is deployed"
  ansible.builtin.import_role:
    name: "common"
    tasks_from: "ensure_stack"
  vars:
    stack_name: "crowdsec"

- name: "Configure Traefik Bouncer API Key in Crowdsec Engine"
  ansible.builtin.command: >
    docker exec crowdsec cscli bouncers add traefik-bouncer -k "{{ crowdsec_traefik_bouncer_key }}"
  register: "_add_bouncer"
  failed_when:
    - "_add_bouncer.rc != 0"
    - "'already exists' not in _add_bouncer.stderr"
  changed_when: "_add_bouncer.rc == 0"
  no_log: true

- name: "Inject CrowdSec Bouncer plugin into Traefik static config"
  ansible.builtin.blockinfile:
    path: "/etc/dokploy/traefik/traefik.yml"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: CROWDSEC CONFIG"
    block: |
      accessLog:
        format: common
        filePath: /proc/self/fd/1
      experimental:
        plugins:
          bouncer:
            moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
            version: v1.5.1
  notify: "Restart Traefik"

- name: "Inject CrowdSec Bouncer middleware into websecure entrypoint by default"
  ansible.builtin.replace:
    path: "/etc/dokploy/traefik/traefik.yml"
    regexp: >-
      websecure:\s*\n\s*address: :443(\s*http3:\s*\n\s*advertisedPort: 443)?
      (\s*http:\s*\n\s*middlewares:\s*\n\s*-\s*"crowdsec-bouncer@file")?
    replace: |
      websecure:
          address: :443
          http3:
            advertisedPort: 443
          http:
            middlewares:
              - "crowdsec-bouncer@file"
  notify: "Restart Traefik"

- name: "Ensure dynamic middleware directory exists"
  ansible.builtin.file:
    path: "/etc/dokploy/traefik/dynamic"
    state: "directory"
    mode: "0755"

- name: "Inject Crowdsec Bouncer Middleware dynamically"
  ansible.builtin.copy:
    dest: "/etc/dokploy/traefik/dynamic/middlewares.yml"
    content: |
      # ANSIBLE MANAGED
      http:
        middlewares:
          crowdsec-bouncer:
            plugin:
              bouncer:
                enabled: true
                crowdsecMode: stream
                crowdsecLapiHost: crowdsec:8080
                crowdsecLapiKey: "{{ crowdsec_traefik_bouncer_key }}"
                # AppSec (WAF) support
                crowdsecAppsecEnabled: true
                crowdsecAppsecHost: crowdsec:7422
                crowdsecAppsecFailureBlock: true
                crowdsecAppsecUnreachableBlock: true
    mode: "0644"

- name: "Clean up dummy default acquis.yaml"
  ansible.builtin.copy:
    dest: "{{ repo_stacks_dir }}/crowdsec/data/config/acquis.yaml"
    content: |
      # ANSIBLE MANAGED
      # All acquisition configurations are managed via acquis.d/
    mode: "0644"

- name: "Get Dokploy-Traefik container info"
  community.docker.docker_container_info:
    name: "dokploy-traefik"
  register: "_traefik_info"

- name: "Set Traefik log path fact"
  ansible.builtin.set_fact:
    traefik_log_path: "{{ _traefik_info.container.LogPath }}"

- name: "Ensure Crowdsec configuration directory exists"
  ansible.builtin.file:
    path: "{{ repo_stacks_dir }}/crowdsec/data/config/acquis.d"
    state: "directory"
    mode: "0755"

- name: "Configure CrowdSec Acquisition (zapp.yaml)"
  ansible.builtin.copy:
    dest: "{{ repo_stacks_dir }}/crowdsec/data/config/acquis.d/zapp.yaml"
    content: |
      # ANSIBLE MANAGED
      # Read ONLY Traefik access logs to avoid nil interface errors from other containers
      filenames:
        - "{{ traefik_log_path }}"
      labels:
        type: traefik
      ---
      # Read SSH and system logs
      filenames:
        - /var/log/auth.log
        - /var/log/syslog
      labels:
        type: syslog
      ---
      # AppSec (WAF) Acquisition
      source: appsec
      listen_addr: 0.0.0.0:7422
      appsec_config: crowdsecurity/appsec-default
      labels:
        type: appsec
    mode: "0644"
  notify: "Restart CrowdSec"

- name: "Warn if home external IP could not be resolved"
  ansible.builtin.debug:
    msg: "WARNING: Could not resolve home external IP. CrowdSec whitelist and unbanning tasks will be skipped."
  when: "home_external_ip | length == 0"

- name: "Ensure Crowdsec s02-enrich directory exists"
  ansible.builtin.file:
    path: "{{ repo_stacks_dir }}/crowdsec/data/config/parsers/s02-enrich"
    state: "directory"
    mode: "0755"
  when: "home_external_ip | length > 0"

- name: "Configure Crowdsec Home Whitelist"
  ansible.builtin.template:
    src: "zapp/crowdsec-whitelist.yaml.j2"
    dest: "{{ repo_stacks_dir }}/crowdsec/data/config/parsers/s02-enrich/home-whitelist.yaml"
    mode: "0644"
  register: "_crowdsec_whitelist"
  notify: "Restart CrowdSec"
  when: "home_external_ip | length > 0"

- name: "Flush handlers to restart CrowdSec if needed"
  ansible.builtin.meta: "flush_handlers"

- name: "Unban home external IP in CrowdSec"
  ansible.builtin.command: >
    docker exec crowdsec cscli decisions delete --ip "{{ home_external_ip }}"
  register: "_unban_ip"
  failed_when: false
  changed_when: "'0 decision(s) deleted' not in _unban_ip.stdout"
  when: "home_external_ip | length > 0"
