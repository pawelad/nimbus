---
- name: "Allow Rathole port through UFW"
  community.general.ufw:
    rule: allow
    port: "2333"
    proto: tcp
    comment: "Rathole"

- name: "Allow Rathole port (Route) through UFW"
  community.general.ufw:
    rule: allow
    port: "2333"
    proto: tcp
    route: true
    comment: "Rathole Route"

- name: "Ensure Rathole server configuration"
  ansible.builtin.import_role:
    name: common
    tasks_from: ensure_config
  vars:
    service_name: "rathole"
    config_src: "{{ inventory_hostname }}/rathole.toml.j2"
    config_dest: "{{ apps_data_dir }}/rathole/rathole.toml"
    mode: "0640"
    owner: "{{ server_user }}"
    group: "{{ server_user }}"

- name: "Ensure Rathole stack is up to date"
  ansible.builtin.import_role:
    name: common
    tasks_from: ensure_stack
  vars:
    stack_name: rathole
    env_template: "{{ inventory_hostname }}/rathole.env.j2"
