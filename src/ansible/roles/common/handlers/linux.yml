---
- name: "Reload ufw"
  ansible.builtin.command: "ufw reload"
  changed_when: true

- name: "Restart Bluetooth"
  ansible.builtin.systemd:
    daemon_reload: true
    name: bluetooth
    state: restarted

- name: "Restart CrowdSec"
  community.docker.docker_compose_v2:
    project_src: "{{ repo_stacks_dir }}/crowdsec"
    state: restarted

- name: "Restart Docker"
  ansible.builtin.service:
    name: docker
    state: restarted

- name: "Restart fail2ban"
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: "Restart ssh"
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: "Restart systemd-journald"
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: "Restart systemd-resolved"
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted

- name: "Restart ufw"
  ansible.builtin.service:
    name: ufw
    state: restarted
