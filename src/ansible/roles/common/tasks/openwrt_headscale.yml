---
- name: "Set Headscale UCI configuration"
  community.openwrt.uci:
    command: "set"
    config: "tailscale"
    section: "settings"
    option: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: "login_server", value: "{{ headscale_server_url }}" }
    - { key: "authkey", value: "{{ tailscale_authkey }}" }
  no_log: true
  notify:
    - "Commit UCI tailscale"
    - "Restart gl_tailscale"

- name: "Enable NAT and forwarding for Tailscale on router"
  notify: "Restart OpenWrt firewall"
  block:
    - name: "Enable Masquerade on tailscale0 zone"
      community.openwrt.uci:
        command: "set"
        config: firewall
        section: "tailscale0"
        option: "masq"
        value: "1"

    - name: "Allow forwarding from LAN to Tailscale"
      community.openwrt.uci:
        command: section
        config: firewall
        type: forwarding
        value:
          src: "lan"
          dest: "tailscale0"

- name: "Patch /usr/bin/gl_tailscale for Headscale persistence"
  ansible.builtin.blockinfile:
    path: "/usr/bin/gl_tailscale"
    insertbefore: "^\\s*timeout 10 /usr/sbin/tailscale up"
    marker: "        # {mark} Headscale automation"
    block: |
              login_server=$(uci -q get tailscale.settings.login_server)
              [ -n "$login_server" ] && param="$param --login-server=$login_server"
              authkey=$(uci -q get tailscale.settings.authkey)
              [ -n "$authkey" ] && param="$param --authkey=$authkey"
              param="$param --accept-dns=true"
  notify: "Restart gl_tailscale"

- name: "Remove conflicting flags from /usr/bin/gl_tailscale"
  ansible.builtin.replace:
    path: "/usr/bin/gl_tailscale"
    regexp: "{{ item }}"
    replace: ""
  loop:
    - "--reset "
    - "--accept-dns=false"
  notify: "Restart gl_tailscale"
